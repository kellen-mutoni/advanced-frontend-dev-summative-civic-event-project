<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up | CivicEvents</title>
  <link rel="icon" href="../img/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Mulish:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind-config.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-neutral-950 font-body text-white">
  <header id="navbar"></header>

  <main id="main" class="mx-auto w-full max-w-md flex-1 px-6 py-12">
    <h1 class="font-heading text-4xl uppercase">Create account</h1>

    <form id="signup-form" class="mt-8 space-y-5" novalidate>
      <p id="form-error" role="alert" class="hidden bg-red-900 px-4 py-3 text-sm"></p>

      <p>
        <label for="full_name" class="block text-sm font-bold">Full name</label>
        <input id="full_name" name="full_name" type="text" autocomplete="name" required class="mt-1 w-full bg-neutral-800 px-3 py-2 text-white">
      </p>

      <p>
        <label for="email" class="block text-sm font-bold">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required class="mt-1 w-full bg-neutral-800 px-3 py-2 text-white">
      </p>

      <p>
        <label for="password" class="block text-sm font-bold">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-hint" class="mt-1 w-full bg-neutral-800 px-3 py-2 text-white">
      </p>
      <p id="password-hint" class="!mt-1 text-xs text-gray-300">At least 8 characters, with upper and lower case, a number and a special character.</p>
      <meter id="strength-bar" min="0" max="4" low="1" high="3" optimum="4" value="0" aria-label="Password strength" class="!mt-2 block h-3 w-full"></meter>
      <output id="strength-text" for="password" class="!mt-1 block text-xs text-gray-300"></output>

      <p>
        <label for="confirm_password" class="block text-sm font-bold">Confirm password</label>
        <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required class="mt-1 w-full bg-neutral-800 px-3 py-2 text-white">
      </p>

      <button type="submit" class="w-full bg-brand-dark px-5 py-3 text-sm font-bold uppercase text-white">Sign up</button>
    </form>

    <p class="mt-6 text-sm text-gray-300">Already have an account? <a href="login.html" class="text-brand underline">Log in</a></p>
  </main>

  <footer id="footer"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/signup.js"></script>
</body>
</html>
