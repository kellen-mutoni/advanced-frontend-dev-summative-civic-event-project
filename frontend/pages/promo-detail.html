<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promo | CivicEvents</title>
  <link rel="icon" href="../img/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Mulish:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind-config.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-neutral-950 font-body text-white">
  <header id="navbar"></header>

  <main id="main" class="mx-auto w-full max-w-3xl flex-1 px-6 py-12">
    <p><a href="promos.html" class="text-sm text-brand underline"><span aria-hidden="true">&larr;</span> Back to promos</a></p>

    <p id="load-error" role="alert" class="mt-6 hidden bg-red-900 px-4 py-3 text-sm">
      <span id="error-text"></span>
      <button id="retry-btn" type="button" class="ml-3 underline">Try again</button>
    </p>

    <p id="skeleton" class="mt-6 h-96 animate-pulse bg-neutral-800" aria-hidden="true"></p>

    <article id="promo" class="mt-6 hidden">
      <h1 id="title" class="font-heading text-4xl uppercase"></h1>
      <p class="mt-2 text-sm text-gray-300"><time id="created"></time></p>
      <p id="description" class="mt-4 whitespace-pre-line text-gray-200"></p>

      <video id="player" controls preload="metadata" class="mt-6 w-full bg-black">
        Your browser cannot play this video.
        <a id="download-link" class="underline">Download the video</a> instead.
      </video>
      <p id="video-error" role="alert" class="mt-2 hidden text-sm text-red-300"></p>

      <p class="mt-4 flex flex-wrap items-center gap-4">
        <button id="captions-btn" type="button" aria-pressed="true" class="border border-gray-500 px-4 py-2 text-sm uppercase text-white">Captions: on</button>
        <a id="edit-link" class="hidden border border-gray-500 px-4 py-2 text-sm uppercase text-white">Edit promo</a>
      </p>

      <details class="mt-6 bg-neutral-900 p-4">
        <summary class="cursor-pointer text-sm font-bold uppercase">Transcript</summary>
        <p id="transcript" class="mt-3 whitespace-pre-line text-sm text-gray-300"></p>
      </details>
    </article>
  </main>

  <footer id="footer"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/promo-detail.js"></script>
</body>
</html>
