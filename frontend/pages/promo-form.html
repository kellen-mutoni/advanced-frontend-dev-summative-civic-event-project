<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promo form | CivicEvents</title>
  <link rel="icon" href="../img/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Mulish:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind-config.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-neutral-950 font-body text-white">
  <header id="navbar"></header>

  <main id="main" class="mx-auto w-full max-w-2xl flex-1 px-6 py-12">
    <h1 id="page-title" class="font-heading text-4xl uppercase">Promo</h1>

    <form id="promo-form" class="mt-8 space-y-5" novalidate>
      <p id="form-error" role="alert" class="hidden bg-red-900 px-4 py-3 text-sm"></p>

      <p>
        <label for="title" class="block text-sm font-bold">Title</label>
        <input id="title" name="title" type="text" required class="mt-1 w-full bg-neutral-800 px-3 py-2 text-white">
      </p>

      <p>
        <label for="description" class="block text-sm font-bold">Description</label>
        <textarea id="description" name="description" rows="3" required class="mt-1 w-full bg-neutral-800 px-3 py-2 text-white"></textarea>
      </p>

      <p>
        <label for="caption_text" class="block text-sm font-bold">Captions</label>
        <textarea id="caption_text" name="caption_text" rows="5" required aria-describedby="caption-hint" class="mt-1 w-full bg-neutral-800 px-3 py-2 text-white"></textarea>
      </p>
      <p id="caption-hint" class="!mt-1 text-xs text-gray-300">Write one caption per line. They are spread evenly across the video. You can also paste a WebVTT file's text.</p>

      <p>
        <label for="video" class="block text-sm font-bold">Video file</label>
        <input id="video" name="video" type="file" accept=".mp4,.mov,.avi,.mkv" aria-describedby="video-hint" class="mt-1 block w-full text-sm text-gray-300 file:mr-4 file:border-0 file:bg-neutral-700 file:px-4 file:py-2 file:text-white">
      </p>
      <p id="video-hint" class="!mt-1 text-xs text-gray-300">MP4, MOV, AVI or MKV, up to 8 MB.</p>

      <video id="video-preview" controls class="hidden w-full">
        Your browser cannot play this video.
      </video>

      <progress id="upload-progress" max="100" value="0" aria-label="Upload progress" class="hidden w-full"></progress>

      <p class="flex gap-4">
        <button id="save-btn" type="submit" class="bg-brand-dark px-6 py-3 text-sm font-bold uppercase text-white">Save promo</button>
        <a href="promos.html" class="border border-gray-500 px-6 py-3 text-sm uppercase text-white">Cancel</a>
      </p>
    </form>
  </main>

  <footer id="footer"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/promo-form.js"></script>
</body>
</html>
