<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events | CivicEvents</title>
  <link rel="icon" href="../img/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Mulish:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind-config.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-neutral-950 font-body text-white">
  <header id="navbar"></header>

  <main id="main" class="mx-auto w-full max-w-6xl flex-1 px-6 py-12">
    <header class="flex flex-wrap items-center justify-between gap-4">
      <h1 class="font-heading text-4xl uppercase">Events</h1>
      <a id="create-event-link" href="event-form.html" class="hidden bg-brand-dark px-5 py-2 text-sm font-bold uppercase text-white">Create event</a>
    </header>

    <form id="filter-form" class="mt-8 grid gap-4 md:grid-cols-4" aria-label="Filter events">
      <p>
        <label for="filter-search" class="block text-sm font-bold">Search</label>
        <input id="filter-search" type="search" placeholder="Title or description" class="mt-1 w-full bg-neutral-800 px-3 py-2 text-white placeholder-gray-400">
      </p>
      <p>
        <label for="filter-location" class="block text-sm font-bold">Location</label>
        <input id="filter-location" type="text" placeholder="e.g. Kigali" class="mt-1 w-full bg-neutral-800 px-3 py-2 text-white placeholder-gray-400">
      </p>
      <p>
        <label for="filter-date" class="block text-sm font-bold">From date</label>
        <input id="filter-date" type="date" class="mt-1 w-full bg-neutral-800 px-3 py-2 text-white">
      </p>
      <button id="clear-filters" type="button" class="self-end border border-gray-500 px-5 py-2 text-sm uppercase text-white">Clear filters</button>
    </form>

    <p id="results-info" class="mt-6 text-sm text-gray-300" aria-live="polite"></p>

    <p id="events-error" role="alert" class="mt-6 hidden bg-red-900 px-4 py-3 text-sm">
      <span id="error-text"></span>
      <button id="retry-btn" type="button" class="ml-3 underline">Try again</button>
    </p>

    <ul id="events-list" class="mt-6 grid gap-6 sm:grid-cols-2 lg:grid-cols-3" aria-busy="true"></ul>

    <p id="empty-state" class="mt-10 hidden text-center text-gray-300">No events match your search.</p>

    <nav id="pagination" class="mt-10 flex items-center justify-center gap-4" aria-label="Pagination"></nav>
  </main>

  <footer id="footer"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/events.js"></script>
</body>
</html>
