<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promos | CivicEvents</title>
  <link rel="icon" href="../img/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Mulish:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind-config.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-neutral-950 font-body text-white">
  <header id="navbar"></header>

  <main id="main" class="mx-auto w-full max-w-6xl flex-1 px-6 py-12">
    <header class="flex flex-wrap items-center justify-between gap-4">
      <h1 class="font-heading text-4xl uppercase">Promos</h1>
      <a id="create-link" href="promo-form.html" class="hidden bg-brand-dark px-5 py-2 text-sm font-bold uppercase text-white">New promo</a>
    </header>

    <p id="load-error" role="alert" class="mt-6 hidden bg-red-900 px-4 py-3 text-sm">
      <span id="error-text"></span>
      <button id="retry-btn" type="button" class="ml-3 underline">Try again</button>
    </p>

    <ul id="promos-list" class="mt-8 grid gap-6 sm:grid-cols-2 lg:grid-cols-3" aria-busy="true"></ul>

    <p id="empty-state" class="mt-8 hidden text-gray-300">There are no promos yet.</p>
  </main>

  <footer id="footer"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/promos.js"></script>
</body>
</html>
