<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Announcement | CivicEvents</title>
  <link rel="icon" href="../img/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Mulish:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind-config.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-neutral-950 font-body text-white">
  <header id="navbar"></header>

  <main id="main" class="mx-auto w-full max-w-2xl flex-1 px-6 py-12">
    <p><a href="announcements.html" class="text-sm text-brand underline"><span aria-hidden="true">&larr;</span> Back to announcements</a></p>

    <p id="load-error" role="alert" class="mt-6 hidden bg-red-900 px-4 py-3 text-sm">
      <span id="error-text"></span>
      <button id="retry-btn" type="button" class="ml-3 underline">Try again</button>
    </p>

    <p id="skeleton" class="mt-6 h-64 animate-pulse bg-neutral-800" aria-hidden="true"></p>

    <article id="announcement" class="mt-6 hidden">
      <h1 id="title" class="font-heading text-4xl uppercase"></h1>
      <p class="mt-2 text-sm text-gray-300"><time id="created"></time></p>

      <audio id="player" controls preload="metadata" class="mt-6 w-full">
        Your browser cannot play this audio format.
        <a id="download-link" class="underline">Download the audio file</a> instead.
      </audio>
      <p id="time-display" class="mt-2 text-sm text-gray-300">0:00 / 0:00</p>

      <p class="mt-6">
        <a id="edit-link" class="hidden border border-gray-500 px-6 py-3 text-sm uppercase text-white">Edit announcement</a>
      </p>
    </article>
  </main>

  <footer id="footer"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/announcement-detail.js"></script>
</body>
</html>
