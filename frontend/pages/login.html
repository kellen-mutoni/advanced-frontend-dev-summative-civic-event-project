<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | CivicEvents</title>
  <link rel="icon" href="../img/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Mulish:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind-config.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-neutral-950 font-body text-white">
  <header id="navbar"></header>

  <main id="main" class="mx-auto w-full max-w-md flex-1 px-6 py-12">
    <h1 class="font-heading text-4xl uppercase">Log in</h1>

    <form id="login-form" class="mt-8 space-y-5" novalidate>
      <p id="form-error" role="alert" class="hidden bg-red-900 px-4 py-3 text-sm"></p>

      <p>
        <label for="email" class="block text-sm font-bold">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required class="mt-1 w-full bg-neutral-800 px-3 py-2 text-white">
      </p>

      <p>
        <label for="password" class="block text-sm font-bold">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required class="mt-1 w-full bg-neutral-800 px-3 py-2 text-white">
      </p>

      <button type="submit" class="w-full bg-brand-dark px-5 py-3 text-sm font-bold uppercase text-white">Log in</button>
    </form>

    <p class="mt-6 text-sm text-gray-300">New here? <a href="signup.html" class="text-brand underline">Create an account</a></p>
  </main>

  <footer id="footer"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
